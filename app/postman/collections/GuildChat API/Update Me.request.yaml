$kind: http-request
name: Update Me
method: PUT
url: '{{baseUrl}}/me'
order: 5200
description: |-
  Updates user A. Both username and email are required: this is a full
  replace, not a patch. Answers 200, 400 on validation, 404 if the account
  is gone, 409 if the new username or email is taken.

  Renames A to `edited<runId>` so the change is visible in the response.
headers:
  - key: Authorization
    value: 'Bearer {{tokenA}}'
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "username": "edited{{runId}}",
      "email": "edited{{runId}}@example.com"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 200', function () {
          pm.response.to.have.status(200);
      });

      pm.test('Content-Type is application/json', function () {
          pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json');
      });

      pm.test('Body is a user with no password field', function () {
          const u = pm.response.json();
          pm.expect(u).to.have.property('id').that.is.a('number');
          pm.expect(u).to.have.property('username').that.is.a('string');
          pm.expect(u).to.have.property('email').that.is.a('string');
          pm.expect(u).to.have.property('created_at');
          pm.expect(u).to.have.property('updated_at');
          pm.expect(u).to.not.have.any.keys('password', 'password_hash', 'PasswordHash');
      });

      const runId = pm.collectionVariables.get('runId');

      pm.test('Both fields were applied', function () {
          const u = pm.response.json();
          pm.expect(u.username).to.eql('edited' + runId);
          pm.expect(u.email).to.eql('edited' + runId + '@example.com');
      });

      pm.test('Still the same account', function () {
          pm.expect(pm.response.json().id).to.eql(Number(pm.collectionVariables.get('userAId')));
      });

      // Later requests log in as A again, so remember the new address.
      pm.collectionVariables.set('userAEmail', 'edited' + runId + '@example.com');
