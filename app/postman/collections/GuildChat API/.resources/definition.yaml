$kind: collection
name: GuildChat API
description: |-
  API collection for the GuildChat service (Go + Gin).

  Covers every route in `internal/router/router.go`, including the failure
  cases (400 / 401 / 404 / 409). See `endpoints.md` for the written reference.

  ## Running it

  Start the server, point `baseUrl` at it, and run the whole collection top to
  bottom. Requests are ordered so the run tells a story:

    1. Root seeds `runId`, a timestamp suffix that keeps usernames and emails
       unique, so the collection can be re-run against the same database.
    2. Three throwaway users are registered and logged in. Their tokens land in
       `tokenA` / `tokenB` / `tokenC`.
    3. The account endpoints are exercised as A.
    4. A asks B, B accepts - checking the inbox, the outbox, and that both
       users then see each other in /me/friends.
    5. A asks C, C rejects, then A asks again - which must succeed, because
       rejecting deletes the row rather than marking it.
    6. A asks C once more and cancels it themselves, checking that a third
       party cannot, and that the request leaves both the outbox and the inbox.
       Then A asks again and C removes it from their side, since cancelling is
       open to both parties.
    7. B unfriends A, after checking that a pending row cannot be unfriended
       and that a third party cannot break up someone else's friendship. The
       friendship disappears from both users' /me/friends.
    8. All three accounts are deleted.

  Individual requests will fail on their own: most read a collection variable
  set by an earlier one. Run the collection, not a single request.

  Nothing here is seeded manually. Every id, token and email used by a later
  request is captured from an earlier response.
variables:
  baseUrl: http://localhost:8080
  runId: ""
  userAId: ""
  userBId: ""
  userCId: ""
  userAUsername: ""
  userBUsername: ""
  userCUsername: ""
  userAEmail: ""
  tokenA: ""
  tokenB: ""
  tokenC: ""
  friendshipAB: ""
  friendshipAC: ""
  friendshipAC2: ""
  friendshipAC3: ""
  friendshipAC4: ""
  friendshipAC5: ""
auth:
  type: noauth
