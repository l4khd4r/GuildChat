$kind: http-request
order: 14000
method: DELETE
url: '{{baseUrl}}/friend-request/{{cancelledRequestId}}'
headers:
  - key: Authorization
    value: 'Bearer {{authToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("status is 200", () => pm.response.to.have.status(200));
      pm.test("confirms the deletion", () => {
        pm.expect(pm.response.json().message).to.include("deleted");
      });
