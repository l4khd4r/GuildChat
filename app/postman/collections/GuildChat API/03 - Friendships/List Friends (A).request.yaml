$kind: http-request
order: 6000
method: GET
url: '{{baseUrl}}/me/friends'
headers:
  - key: Authorization
    value: 'Bearer {{authToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("status is 200", () => pm.response.to.have.status(200));
      pm.test("B is now a friend of A", () => {
        const ids = pm.response.json().map(u => u.id);
        pm.expect(ids).to.include(Number(pm.collectionVariables.get("otherUserId")));
      });
