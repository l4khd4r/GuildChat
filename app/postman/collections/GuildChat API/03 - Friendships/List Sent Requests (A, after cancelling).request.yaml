$kind: http-request
order: 15000
method: GET
url: '{{baseUrl}}/me/friend-requests/sent'
headers:
  - key: Authorization
    value: 'Bearer {{authToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("status is 200", () => pm.response.to.have.status(200));
      pm.test("the cancelled request is gone", () => {
        const ids = pm.response.json().map(r => r.id);
        pm.expect(ids).to.not.include(Number(pm.collectionVariables.get("cancelledRequestId")));
      });
