$kind: http-request
order: 7000
method: GET
url: '{{baseUrl}}/me/friends'
headers:
  - key: Authorization
    value: 'Bearer {{tokenB}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("status is 200", () => pm.response.to.have.status(200));
      pm.test("A is a friend of B too", () => {
        const ids = pm.response.json().map(u => u.id);
        pm.expect(ids).to.include(Number(pm.collectionVariables.get("userId")));
      });
