$kind: http-request
order: 7000
method: POST
url: '{{baseUrl}}/conversations/{{roomId}}/members'
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{authToken}}'
body:
  type: json
  content: |-
    {
      "user_id": {{memberId}}
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("status is 204", () => pm.response.to.have.status(204));
