$kind: http-request
name: List Pending Friend Requests (C, now empty)
method: GET
url: '{{baseUrl}}/me/friend-requests'
order: 6440
description: |-
  The rejected request must leave C's inbox.
headers:
  - key: Authorization
    value: 'Bearer {{tokenC}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 200', function () {
          pm.response.to.have.status(200);
      });

      pm.test('Body is an array, never null', function () {
          pm.expect(pm.response.json()).to.be.an('array');
      });

      pm.test('The rejected request is gone', function () {
          const ids = pm.response.json().map(r => r.id);
          pm.expect(ids).to.not.include(Number(pm.collectionVariables.get('friendshipAC')));
      });
