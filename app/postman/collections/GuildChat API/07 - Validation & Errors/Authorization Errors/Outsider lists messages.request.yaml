$kind: http-request
order: 13000
method: GET
url: '{{baseUrl}}/conversations/{{roomId}}/messages'
headers:
  - key: Authorization
    value: 'Bearer {{tokenC}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("status is 404", () => pm.response.to.have.status(404));
      pm.test("the same answer reading as writing", () => {
        pm.expect(pm.response.json().error).to.include("conversation not found");
      });
      pm.test("no messages leaked with the error", () => {
        pm.expect(pm.response.json()).to.not.have.property("messages");
      });
