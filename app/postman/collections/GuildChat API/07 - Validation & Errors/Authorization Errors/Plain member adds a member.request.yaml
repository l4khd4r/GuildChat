$kind: http-request
order: 5000
method: POST
url: '{{baseUrl}}/conversations/{{roomId}}/members'
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{tokenB}}'
body:
  type: json
  content: |-
    {
      "user_id": {{thirdUserId}}
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("status is 403", () => pm.response.to.have.status(403));
      pm.test("carries an error message", () => {
        pm.expect(pm.response.json().error).to.be.a("string").and.to.not.be.empty;
      });
      pm.test("explains the failure", () => {
        pm.expect(pm.response.json().error).to.include("only an owner or admin");
      });
