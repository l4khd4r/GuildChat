$kind: http-request
order: 1000
method: POST
url: '{{baseUrl}}/users'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "username": "alicia_{{runId}}",
      "email": "fresh_{{runId}}@guild.test",
      "password": "ChangeMe123!"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("status is 409", () => pm.response.to.have.status(409));
      pm.test("carries an error message", () => {
        pm.expect(pm.response.json().error).to.be.a("string").and.to.not.be.empty;
      });
      pm.test("explains the failure", () => {
        pm.expect(pm.response.json().error).to.include("username already exists");
      });
