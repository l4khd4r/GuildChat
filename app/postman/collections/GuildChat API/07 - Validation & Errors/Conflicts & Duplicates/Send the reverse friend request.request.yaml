$kind: http-request
order: 7000
method: POST
url: '{{baseUrl}}/users/{{userId}}/friend-request'
headers:
  - key: Authorization
    value: 'Bearer {{tokenB}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("status is 409", () => pm.response.to.have.status(409));
      pm.test("carries an error message", () => {
        pm.expect(pm.response.json().error).to.be.a("string").and.to.not.be.empty;
      });
      pm.test("explains the failure", () => {
        pm.expect(pm.response.json().error).to.include("already exists");
      });
