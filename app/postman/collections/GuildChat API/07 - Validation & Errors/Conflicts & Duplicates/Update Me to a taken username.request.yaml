$kind: http-request
order: 8000
method: PUT
url: '{{baseUrl}}/me'
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{authToken}}'
body:
  type: json
  content: |-
    {
      "username": "bob_{{runId}}",
      "email": "alice_{{runId}}@guild.test"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("status is 409", () => pm.response.to.have.status(409));
      pm.test("carries an error message", () => {
        pm.expect(pm.response.json().error).to.be.a("string").and.to.not.be.empty;
      });
      pm.test("explains the failure", () => {
        pm.expect(pm.response.json().error).to.include("username already exists");
      });
