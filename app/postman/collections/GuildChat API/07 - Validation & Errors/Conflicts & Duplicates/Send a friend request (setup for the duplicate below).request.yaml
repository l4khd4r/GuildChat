$kind: http-request
order: 5000
method: POST
url: '{{baseUrl}}/users/{{otherUserId}}/friend-request'
headers:
  - key: Authorization
    value: 'Bearer {{authToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("status is 201", () => pm.response.to.have.status(201));
      pm.collectionVariables.set("conflictRequestId", pm.response.json().id);
