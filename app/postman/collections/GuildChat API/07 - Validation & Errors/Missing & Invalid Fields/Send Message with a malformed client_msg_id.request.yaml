$kind: http-request
order: 13000
method: POST
url: '{{baseUrl}}/conversations/{{roomId}}/messages'
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{authToken}}'
body:
  type: json
  content: |-
    {
      "body": "bad uuid",
      "client_msg_id": "not-a-uuid"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("status is 400", () => pm.response.to.have.status(400));
      pm.test("carries an error message", () => {
        pm.expect(pm.response.json().error).to.be.a("string").and.to.not.be.empty;
      });
