$kind: http-request
order: 15000
method: GET
url: '{{baseUrl}}/conversations/{{roomId}}/messages?before=abc'
headers:
  - key: Authorization
    value: 'Bearer {{authToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("status is 400", () => pm.response.to.have.status(400));
      pm.test("a bad cursor is not silently treated as no cursor", () => {
        pm.expect(pm.response.json().error).to.include("invalid query parameters");
      });
