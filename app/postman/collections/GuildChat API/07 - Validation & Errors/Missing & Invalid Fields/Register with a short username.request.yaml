$kind: http-request
order: 4000
method: POST
url: '{{baseUrl}}/users'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "username": "ab",
      "email": "ab_{{runId}}@guild.test",
      "password": "ChangeMe123!"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("status is 400", () => pm.response.to.have.status(400));
      pm.test("carries an error message", () => {
        pm.expect(pm.response.json().error).to.be.a("string").and.to.not.be.empty;
      });
      pm.test("explains the failure", () => {
        pm.expect(pm.response.json().error).to.include("Username");
      });
