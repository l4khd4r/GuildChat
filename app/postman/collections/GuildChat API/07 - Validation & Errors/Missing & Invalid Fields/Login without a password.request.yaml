$kind: http-request
order: 5000
method: POST
url: '{{baseUrl}}/auth/login'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "alice_{{runId}}@guild.test"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("status is 400", () => pm.response.to.have.status(400));
      pm.test("carries an error message", () => {
        pm.expect(pm.response.json().error).to.be.a("string").and.to.not.be.empty;
      });
