$kind: http-request
order: 4000
method: POST
url: '{{baseUrl}}/conversations/room'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "should not exist"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("status is 401", () => pm.response.to.have.status(401));
      pm.test("carries an error message", () => {
        pm.expect(pm.response.json().error).to.be.a("string").and.to.not.be.empty;
      });
