$kind: http-request
name: Login C
method: POST
url: '{{baseUrl}}/auth/login'
order: 4200
description: |-
  Logs in user C and stores the JWT as `tokenC`, which the protected
  requests below send as `Authorization: Bearer {{tokenC}}`.

  Answers 200 with the token, 400 for an invalid payload, 401 for bad
  credentials.
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "email": "userc{{runId}}@example.com",
      "password": "ChangeMe123!"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 200', function () {
          pm.response.to.have.status(200);
      });

      pm.test('Content-Type is application/json', function () {
          pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json');
      });

      const body = pm.response.json();

      pm.test('Returns a token and a user summary', function () {
          pm.expect(body).to.have.property('token').that.is.a('string').and.not.empty;
          pm.expect(body.user).to.have.property('id');
          pm.expect(body.user).to.have.property('username');
          pm.expect(body.user).to.have.property('email');
      });

      pm.test('Token is a three-part JWT', function () {
          pm.expect(body.token.split('.')).to.have.lengthOf(3);
      });

      pm.collectionVariables.set('tokenC', body.token);
