$kind: http-request
order: 5000
method: POST
url: '{{baseUrl}}/auth/login'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "dave_{{runId}}@guild.test",
      "password": "ChangeMe123!"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("status is 200", () => pm.response.to.have.status(200));
      pm.collectionVariables.set("disposableToken", pm.response.json().token);
