$kind: http-request
order: 2000
method: PUT
url: '{{baseUrl}}/me'
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{authToken}}'
body:
  type: json
  content: |-
    {
      "username": "alicia_{{runId}}",
      "email": "alice_{{runId}}@guild.test"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("status is 200", () => pm.response.to.have.status(200));
      pm.test("response is a user object", () => {
        const u = pm.response.json();
        pm.expect(u).to.have.all.keys("id", "username", "email", "created_at", "updated_at");
        pm.expect(u.id).to.be.a("number");
      });
      pm.test("no credential fields leak", () => {
        const raw = pm.response.text();
        pm.expect(raw).to.not.include("password");
        pm.expect(raw).to.not.include("PasswordHash");
      });
      pm.test("username changed, identity did not", () => {
        const u = pm.response.json();
        pm.expect(u.username).to.eql("alicia_" + pm.collectionVariables.get("runId"));
        pm.expect(u.id).to.eql(Number(pm.collectionVariables.get("userId")));
      });
