$kind: http-request
order: 3000
method: POST
url: '{{baseUrl}}/conversations/room'
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{authToken}}'
body:
  type: json
  content: |-
    {
      "name": "Guild Hall {{runId}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("status is 201", () => pm.response.to.have.status(201));
      const c = pm.response.json().conversation;
      pm.collectionVariables.set("roomId", c.id);
      pm.test("is a room owned by A", () => {
      pm.expect(c).to.include.keys("id", "type", "created_by", "created_at", "updated_at");
        pm.expect(c.type).to.eql("room");
        pm.expect(c.name).to.eql("Guild Hall " + pm.collectionVariables.get("runId"));
        pm.expect(c.created_by).to.eql(Number(pm.collectionVariables.get("userId")));
      });
