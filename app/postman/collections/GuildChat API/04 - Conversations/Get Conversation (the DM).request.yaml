$kind: http-request
order: 5000
method: GET
url: '{{baseUrl}}/conversations/{{conversationId}}'
headers:
  - key: Authorization
    value: 'Bearer {{authToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("status is 200", () => pm.response.to.have.status(200));
      pm.test("same shape as a list row", () => {
        const c = pm.response.json().conversation;
        pm.expect(c.id).to.eql(Number(pm.collectionVariables.get("conversationId")));
        pm.expect(c.type).to.eql("dm");
        pm.expect(c.other_user.id).to.eql(Number(pm.collectionVariables.get("otherUserId")));
        pm.expect(c.member_count).to.eql(2);
      });
