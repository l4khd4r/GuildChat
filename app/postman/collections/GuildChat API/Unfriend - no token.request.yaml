$kind: http-request
name: Unfriend - no token
method: DELETE
url: '{{baseUrl}}/friends/{{friendshipAB}}'
order: 6600
description: |-
  Like every other /friends route, unfriending sits behind the auth
  middleware, so a missing Authorization header never reaches the handler.
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 401', function () {
          pm.response.to.have.status(401);
      });

      pm.test('Body is the error', function () {
          pm.expect(pm.response.json()).to.have.property('error');
      });
