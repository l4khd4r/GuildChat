$kind: http-request
name: Reject Friend Request (C)
method: POST
url: '{{baseUrl}}/friend-request/{{friendshipAC}}/reject'
order: 6420
description: |-
  C turns A down. The response reports status "rejected", although the row
  is deleted rather than marked - see the repository's Reject method.
headers:
  - key: Authorization
    value: 'Bearer {{tokenC}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 200', function () {
          pm.response.to.have.status(200);
      });

      pm.test('Content-Type is application/json', function () {
          pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json');
      });

      pm.test('Body is a friendship', function () {
          const f = pm.response.json();
          pm.expect(f).to.have.property('id').that.is.a('number');
          pm.expect(f).to.have.property('requester_id').that.is.a('number');
          pm.expect(f).to.have.property('receiver_id').that.is.a('number');
          pm.expect(f).to.have.property('status').that.is.a('string');
      });

      pm.test('Reported as rejected', function () {
          pm.expect(pm.response.json().status).to.eql('rejected');
      });

      pm.test('Same friendship that was requested', function () {
          pm.expect(pm.response.json().id).to.eql(Number(pm.collectionVariables.get('friendshipAC')));
      });
