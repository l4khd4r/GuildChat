$kind: http-request
name: Delete Me (A)
method: DELETE
url: '{{baseUrl}}/me'
order: 9020
description: |-
  Deletes throwaway user A. Answers 204 with no body, 404 if the account
  is already gone.

  Friendship rows referencing the user go with it, via ON DELETE CASCADE
  on both foreign keys.
headers:
  - key: Authorization
    value: 'Bearer {{tokenA}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 204', function () {
          pm.response.to.have.status(204);
      });

      pm.test('No body on a 204', function () {
          pm.expect(pm.response.text()).to.be.empty;
      });
