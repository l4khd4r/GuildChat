$kind: http-request
name: Login - wrong password
method: POST
url: '{{baseUrl}}/auth/login'
order: 4300
description: |-
  Expects 401. The message must not distinguish "no such user" from "wrong
  password".
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "email": "usera{{runId}}@example.com",
      "password": "WrongPassword123!"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 401', function () {
          pm.response.to.have.status(401);
      });

      pm.test('Does not leak whether the account exists', function () {
          pm.expect(pm.response.json().error).to.match(/invalid credentials/i);
      });
