$kind: http-request
name: Unfriend (B removes A)
method: DELETE
url: '{{baseUrl}}/friends/{{friendshipAB}}'
order: 6670
description: |-
  The real thing. A sent the request and B accepted it, and here B is the one
  breaking it off - unfriending is open to both sides, so direction does not
  matter, only that the caller is a party to the row. The friendship is
  deleted, not marked, which is why the two can befriend each other again
  afterwards.
headers:
  - key: Authorization
    value: 'Bearer {{tokenB}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 200', function () {
          pm.response.to.have.status(200);
      });

      pm.test('Content-Type is application/json', function () {
          pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json');
      });

      pm.test('Body confirms the deletion', function () {
          pm.expect(pm.response.json()).to.have.property('message');
      });
