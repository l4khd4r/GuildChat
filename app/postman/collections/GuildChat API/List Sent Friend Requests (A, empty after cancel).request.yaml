$kind: http-request
name: List Sent Friend Requests (A, empty after cancel)
method: GET
url: '{{baseUrl}}/me/friend-requests/sent'
order: 6530
description: |-
  The cancelled request is gone from A's outbox, which is what the endpoint
  is for.
headers:
  - key: Authorization
    value: 'Bearer {{tokenA}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 200', function () {
          pm.response.to.have.status(200);
      });

      pm.test('Body is an array, never null', function () {
          pm.expect(pm.response.json()).to.be.an('array');
      });

      pm.test('The cancelled request is gone', function () {
          const ids = pm.response.json().map(r => r.id);
          pm.expect(ids).to.not.include(Number(pm.collectionVariables.get('friendshipAC3')));
      });
