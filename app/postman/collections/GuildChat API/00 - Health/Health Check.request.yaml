$kind: http-request
order: 2000
method: GET
url: '{{baseUrl}}/health'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("status is 200", () => pm.response.to.have.status(200));
      pm.test("reports healthy", () => {
        pm.expect(pm.response.json().status).to.eql("healthy");
      });
