$kind: http-request
order: 2000
method: POST
url: '{{baseUrl}}/conversations/{{roomId}}/messages'
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{tokenB}}'
body:
  type: json
  content: |-
    {
      "body": "A plain member can speak too."
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("status is 201", () => pm.response.to.have.status(201));
      pm.test("no role is required to post", () => {
        pm.expect(pm.response.json().message.sender.id).to.eql(Number(pm.collectionVariables.get("memberId")));
      });
