$kind: http-request
order: 1000
method: POST
url: '{{baseUrl}}/conversations/{{roomId}}/messages'
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{authToken}}'
body:
  type: json
  content: |-
    {
      "body": "First message in the hall."
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("status is 201", () => pm.response.to.have.status(201));
      const m = pm.response.json().message;
      pm.collectionVariables.set("messageId", m.id);
      pm.test("the saved message comes back with its sender", () => {
      pm.expect(m).to.include.keys("id", "conversation_id", "sender", "body", "created_at");
      pm.expect(m.sender).to.have.all.keys("id", "username", "email", "created_at", "updated_at");
      pm.expect(m.edited_at, "a new message is not edited").to.be.undefined;
        pm.expect(m.conversation_id).to.eql(Number(pm.collectionVariables.get("roomId")));
        pm.expect(m.sender.id).to.eql(Number(pm.collectionVariables.get("userId")));
        pm.expect(m.body).to.eql("First message in the hall.");
      });
      pm.test("client_msg_id is absent when none was sent", () => {
        pm.expect(m.client_msg_id).to.be.undefined;
      });
