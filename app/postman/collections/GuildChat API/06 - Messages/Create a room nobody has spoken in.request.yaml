$kind: http-request
order: 10000
method: POST
url: '{{baseUrl}}/conversations/room'
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{authToken}}'
body:
  type: json
  content: |-
    {
      "name": "Silent Hall {{runId}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("status is 201", () => pm.response.to.have.status(201));
      // Fixture for the request below: a conversation with no messages at all.
      pm.collectionVariables.set("emptyRoomId", pm.response.json().conversation.id);
