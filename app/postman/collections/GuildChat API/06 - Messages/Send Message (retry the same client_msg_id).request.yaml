$kind: http-request
order: 4000
method: POST
url: '{{baseUrl}}/conversations/{{roomId}}/messages'
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{authToken}}'
body:
  type: json
  content: |-
    {
      "body": "Sent once, maybe twice.",
      "client_msg_id": "{{clientMsgId}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("status is 201", () => pm.response.to.have.status(201));
      pm.test("no second message was written", () => {
        pm.expect(pm.response.json().message.id).to.eql(Number(pm.collectionVariables.get("idempotentMessageId")));
      });
