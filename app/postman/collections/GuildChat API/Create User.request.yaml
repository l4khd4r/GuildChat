$kind: http-request
name: Create User
method: POST
url: '{{baseUrl}}/users'
order: 3000
description: |-
  Creates a new user.

  Request body fields (all required):
  - username (string)
  - email (string, must be a valid email)
  - password (string)

  Returns 201 Created with the created user on success, 400 for an invalid
  payload, and 500 on failure.
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "username": "guildmaster",
      "email": "guildmaster@example.com",
      "password": "ChangeMe123!"
    }
