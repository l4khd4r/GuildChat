$kind: http-request
name: Get Me - malformed token
method: GET
url: '{{baseUrl}}/me'
order: 5120
description: |-
  Sends a syntactically valid header carrying a token that fails
  validation. Expects 401.
headers:
  - key: Authorization
    value: 'Bearer not.a.real.token'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 401', function () {
          pm.response.to.have.status(401);
      });

      pm.test('Rejects the token', function () {
          pm.expect(pm.response.json().error).to.match(/invalid token/i);
      });
