$kind: http-request
name: Create User C
method: POST
url: '{{baseUrl}}/users'
order: 3200
description: |-
  Registers user C, one of the three throwaway accounts this collection
  uses. Saves the new id as `userCId`, and the credentials as
  `userCEmail` / `userCPassword` for the matching Login request.

  Required fields: username (3-20 chars), email, password (min 8).
  Answers 201 on success, 400 for an invalid payload, 409 if the username
  or email is taken.
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "username": "userc{{runId}}",
      "email": "userc{{runId}}@example.com",
      "password": "ChangeMe123!"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 201', function () {
          pm.response.to.have.status(201);
      });

      pm.test('Content-Type is application/json', function () {
          pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json');
      });

      pm.test('Body is a user with no password field', function () {
          const u = pm.response.json();
          pm.expect(u).to.have.property('id').that.is.a('number');
          pm.expect(u).to.have.property('username').that.is.a('string');
          pm.expect(u).to.have.property('email').that.is.a('string');
          pm.expect(u).to.have.property('created_at');
          pm.expect(u).to.have.property('updated_at');
          pm.expect(u).to.not.have.any.keys('password', 'password_hash', 'PasswordHash');
      });

      const user = pm.response.json();
      pm.collectionVariables.set('userCId', user.id);
      pm.collectionVariables.set('userCUsername', user.username);

      pm.test('Echoes back the username that was sent', function () {
          pm.expect(user.username).to.eql('userc' + pm.collectionVariables.get('runId'));
      });
