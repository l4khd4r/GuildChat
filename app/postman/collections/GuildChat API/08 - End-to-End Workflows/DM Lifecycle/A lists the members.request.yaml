$kind: http-request
order: 8000
method: GET
url: '{{baseUrl}}/conversations/{{w3DmId}}/members'
headers:
  - key: Authorization
    value: 'Bearer {{w3AToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("status is 200", () => pm.response.to.have.status(200));
      pm.test("both sides are plain members", () => {
        const m = pm.response.json().members;
        pm.expect(m).to.have.lengthOf(2);
        pm.expect(m.map(x => x.role)).to.eql(["member", "member"]);
      });
