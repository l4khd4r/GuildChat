$kind: http-request
order: 14000
method: POST
url: '{{baseUrl}}/conversations/{{w5RoomId}}/messages'
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{w5AToken}}'
body:
  type: json
  content: |-
    {
      "body": "room activity"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("status is 201", () => pm.response.to.have.status(201));
