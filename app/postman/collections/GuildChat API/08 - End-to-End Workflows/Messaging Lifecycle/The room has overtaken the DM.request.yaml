$kind: http-request
order: 15000
method: GET
url: '{{baseUrl}}/me/conversations'
headers:
  - key: Authorization
    value: 'Bearer {{w5AToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("status is 200", () => pm.response.to.have.status(200));
      pm.test("the ordering follows the newest message", () => {
        pm.expect(pm.response.json().conversations[0].id).to.eql(Number(pm.collectionVariables.get("w5RoomId")));
      });
