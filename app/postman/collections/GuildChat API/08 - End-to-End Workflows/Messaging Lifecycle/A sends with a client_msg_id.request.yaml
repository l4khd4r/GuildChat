$kind: http-request
order: 10000
method: POST
url: '{{baseUrl}}/conversations/{{w5DmId}}/messages'
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{w5AToken}}'
body:
  type: json
  content: |-
    {
      "body": "retryable",
      "client_msg_id": "{{w5ClientMsgId}}"
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      pm.collectionVariables.set("w5ClientMsgId", pm.variables.replaceIn("{{$guid}}"));
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("status is 201", () => pm.response.to.have.status(201));
      pm.collectionVariables.set("w5IdemId", pm.response.json().message.id);
      pm.test("the client id is echoed", () => {
        pm.expect(pm.response.json().message.client_msg_id).to.eql(pm.collectionVariables.get("w5ClientMsgId"));
      });
