$kind: http-request
order: 7000
method: POST
url: '{{baseUrl}}/friend-request/{{w2ReqId}}/accept'
headers:
  - key: Authorization
    value: 'Bearer {{w2BToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("status is 200", () => pm.response.to.have.status(200));
      pm.test("accepted", () => pm.expect(pm.response.json().status).to.eql("accepted"));
