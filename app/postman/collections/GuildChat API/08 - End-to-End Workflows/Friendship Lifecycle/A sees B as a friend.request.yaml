$kind: http-request
order: 8000
method: GET
url: '{{baseUrl}}/me/friends'
headers:
  - key: Authorization
    value: 'Bearer {{w2AToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("status is 200", () => pm.response.to.have.status(200));
      pm.test("B is listed", () => {
        pm.expect(pm.response.json().map(u => u.id)).to.include(Number(pm.collectionVariables.get("w2BId")));
      });
