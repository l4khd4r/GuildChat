$kind: http-request
order: 6000
method: GET
url: '{{baseUrl}}/me/friend-requests'
headers:
  - key: Authorization
    value: 'Bearer {{w2BToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("status is 200", () => pm.response.to.have.status(200));
      pm.test("the request is waiting, sent by A", () => {
        const row = pm.response.json().find(r => r.id === Number(pm.collectionVariables.get("w2ReqId")));
        pm.expect(row).to.not.be.undefined;
        pm.expect(row.user.id).to.eql(Number(pm.collectionVariables.get("w2AId")));
      });
