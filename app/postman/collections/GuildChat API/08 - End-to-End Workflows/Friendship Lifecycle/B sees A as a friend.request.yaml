$kind: http-request
order: 9000
method: GET
url: '{{baseUrl}}/me/friends'
headers:
  - key: Authorization
    value: 'Bearer {{w2BToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("status is 200", () => pm.response.to.have.status(200));
      pm.test("A is listed", () => {
        pm.expect(pm.response.json().map(u => u.id)).to.include(Number(pm.collectionVariables.get("w2AId")));
      });
