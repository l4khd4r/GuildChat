$kind: http-request
order: 11000
method: POST
url: '{{baseUrl}}/conversations/{{w4RoomId}}/messages'
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{w4MemberToken}}'
body:
  type: json
  content: |-
    {
      "body": "member speaking"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("status is 201", () => pm.response.to.have.status(201));
