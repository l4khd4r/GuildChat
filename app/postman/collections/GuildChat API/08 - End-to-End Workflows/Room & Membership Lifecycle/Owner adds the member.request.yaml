$kind: http-request
order: 9000
method: POST
url: '{{baseUrl}}/conversations/{{w4RoomId}}/members'
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{w4OwnerToken}}'
body:
  type: json
  content: |-
    {
      "user_id": {{w4MemberId}}
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("status is 204", () => pm.response.to.have.status(204));
