$kind: http-request
order: 13000
method: POST
url: '{{baseUrl}}/conversations/{{w4RoomId}}/members'
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{w4MemberToken}}'
body:
  type: json
  content: |-
    {
      "user_id": {{w4OutsiderId}}
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("status is 403", () => pm.response.to.have.status(403));
