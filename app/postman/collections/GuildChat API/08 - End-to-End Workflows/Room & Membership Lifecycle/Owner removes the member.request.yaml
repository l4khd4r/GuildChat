$kind: http-request
order: 15000
method: DELETE
url: '{{baseUrl}}/conversations/{{w4RoomId}}/members/{{w4MemberId}}'
headers:
  - key: Authorization
    value: 'Bearer {{w4OwnerToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("status is 204", () => pm.response.to.have.status(204));
