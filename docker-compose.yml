services:
  postgres:
    image: postgres:17-alpine
    container_name: guildchat-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: guildchat
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d guildchat"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: guildchat-backend
    # the mounted keys/ is owned by the host user; run as that same uid so
    # private.pem stays 0600 instead of being opened up to `other`
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./app/.env
    environment:
      # overrides .env: inside the compose network the DB is reachable
      # by its service name, not localhost
      DB_HOST: postgres
      # keys/ lives outside the build context, so it is mounted at runtime
      JWT_PRIVATE_KEY_PATH: /app/keys/private.pem
      JWT_PUBLIC_KEY_PATH: /app/keys/public.pem
    volumes:
      - ./keys:/app/keys:ro
    restart: unless-stopped

  # dev-only database browser. Not started by `make up`; run `make pgadmin`
  # (i.e. `docker compose --profile tools up -d pgadmin`).
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: guildchat-pgadmin
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: dev@guildchat.io
      PGADMIN_DEFAULT_PASSWORD: pgadmin
      # single-user dev box: skip the pgAdmin login screen entirely
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      # preloads the GuildChat connection on first boot; the password is
      # `postgres`, typed once and saved via "Save password" in the dialog
      - ./dev/pgadmin/servers.json:/pgadmin4/servers.json:ro
      - pgadmin_data:/var/lib/pgadmin
    restart: unless-stopped

volumes:
  postgres_data:
  pgadmin_data:
